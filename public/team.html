<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up a team</title>
<meta name="description" content="Three to eight of you each rate the team on the Trust Equation. Nothing is shown until everyone has answered.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Trust Equation">
<meta property="og:title" content="Score your team on the Trust Equation">
<meta property="og:description" content="Three to eight of you each rate the team. Nothing is shown until everyone has answered.">
<meta property="og:url" content="https://trust.fannarmaximus.com/team">
<meta property="og:image" content="https://trust.fannarmaximus.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://trust.fannarmaximus.com/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<button class="mode-toggle" type="button" aria-label="Switch colour mode"></button>
<main class="wrap">
	<h1>Set up a team</h1>
	<p class="lead mt-1">Everyone gets their own link. Nothing is shown until all of you have answered.</p>
	<hr class="rule">
	<p class="small faint"><a href="/">What's the Trust Equation?</a> · Use nicknames. <a href="/privacy">Privacy</a></p>

	<form id="team-form" class="mt-4" novalidate>
		<label class="field"><span>Team name</span><input type="text" id="team-name" maxlength="40" required autocomplete="off"></label>
		<label class="field"><span>Your nickname</span><input type="text" id="creator-name" maxlength="40" required autocomplete="given-name"></label>

		<p class="small muted">The others (two to seven)</p>
		<div id="members" class="members-list"></div>
		<p><button class="button small" type="button" id="add-row">Add another</button></p>

		<p class="error" id="error" hidden></p>
		<p class="mt-3"><button class="button big" type="submit" id="submit">Create the team</button></p>
	</form>
</main>
<footer class="site-footer">
	<p class="small faint">Made by <a href="https://www.fannarmaximus.com" rel="noopener">Fannar Maximus</a> · <a href="https://github.com/fomaximus/trust.fannarmaximus.com" rel="noopener">Source</a> · <a href="/privacy">Privacy</a></p>
</footer>
<script src="/team.js"></script>
</body>
</html>
