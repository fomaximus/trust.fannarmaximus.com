<body>
<button class="mode-toggle" type="button" aria-label="Switch colour mode"></button>
<main class="wrap">
	<h1>Score someone</h1>
	<p class="mt-1 lead">Rate them, guess how they'll rate you, then send them the link.</p>
	<hr class="rule">
	<p class="small faint"><a href="/">What's the Trust Equation?</a></p>

	<form class="mt-4" id="new-form" novalidate>
		<label class="field"><span>Your first name</span><input type="text" id="creator-name" maxlength="40" required autocomplete="given-name"></label>
		<label class="field"><span>Their first name</span><input type="text" id="invitee-name" maxlength="40" required autocomplete="off"></label>

		<div id="given"></div>
		<div id="predicted"></div>

		<p class="error" id="error" hidden></p>
		<p class="mt-3"><button class="button big" type="submit" id="submit">Seal my scores</button></p>
	</form>
</main>
	<footer class="site-footer">
		<p class="small faint">Made by <a href="https://www.fannarmaximus.com" rel="noopener">Fannar Maximus</a> · <a href="https://github.com/fomaximus/trust.fannarmaximus.com" rel="noopener">Source</a></p>
	</footer>

<script src="/form.js"></script>
